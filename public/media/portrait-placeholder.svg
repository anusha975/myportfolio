<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a050a" />
      <stop offset="50%" stop-color="#120204" />
      <stop offset="100%" stop-color="#080808" />
    </radialGradient>
    <radialGradient id="haloGlow" cx="50%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#e50924" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#8b0000" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#e50924" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50924" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff334b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b0000" stop-opacity="0.8" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(229, 9, 36, 0.08)" stroke-width="1" />
    </pattern>
    <filter id="crimsonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  <rect width="800" height="1000" fill="url(#gridPattern)" />

  <!-- Ambient glowing halos -->
  <circle cx="400" cy="360" r="320" fill="url(#haloGlow)" />
  <circle cx="400" cy="340" r="180" fill="#e50924" opacity="0.12" filter="url(#crimsonBloom)" />

  <!-- Outer frame geometry -->
  <rect x="25" y="25" width="750" height="950" rx="28" fill="none" stroke="url(#edgeGlow)" stroke-width="1.5" stroke-dasharray="16 8" opacity="0.6" />
  
  <!-- Corner geometric markers -->
  <path d="M 45 75 L 45 45 L 75 45" fill="none" stroke="#e50924" stroke-width="2.5" />
  <path d="M 725 45 L 755 45 L 755 75" fill="none" stroke="#e50924" stroke-width="2.5" />
  <path d="M 45 925 L 45 955 L 75 955" fill="none" stroke="#e50924" stroke-width="2.5" />
  <path d="M 725 955 L 755 955 L 755 925" fill="none" stroke="#e50924" stroke-width="2.5" />

  <!-- Abstract Engineering & AI Silhouette -->
  <g transform="translate(0, -30)">
    <!-- Circuit lines radiating from center -->
    <path d="M 280 340 L 160 300 L 120 300" stroke="rgba(229, 9, 36, 0.4)" stroke-width="1.5" fill="none" />
    <circle cx="120" cy="300" r="3.5" fill="#e50924" />
    <path d="M 520 340 L 640 300 L 680 300" stroke="rgba(229, 9, 36, 0.4)" stroke-width="1.5" fill="none" />
    <circle cx="680" cy="300" r="3.5" fill="#e50924" />

    <path d="M 270 420 L 140 450 L 100 450" stroke="rgba(229, 9, 36, 0.3)" stroke-width="1.5" fill="none" />
    <circle cx="100" cy="450" r="3.5" fill="#e50924" />
    <path d="M 530 420 L 660 450 L 700 450" stroke="rgba(229, 9, 36, 0.3)" stroke-width="1.5" fill="none" />
    <circle cx="700" cy="450" r="3.5" fill="#e50924" />

    <!-- Stylized Head Silhouette -->
    <ellipse cx="400" cy="330" rx="100" ry="125" fill="#141419" stroke="#e50924" stroke-width="2" />
    <!-- Cybernetic glasses / visor glow -->
    <path d="M 320 320 Q 400 335 480 320 Q 480 345 400 355 Q 320 345 320 320 Z" fill="#e50924" opacity="0.65" filter="url(#crimsonBloom)" />
    <path d="M 325 322 Q 400 336 475 322" stroke="#ffffff" stroke-width="2" opacity="0.8" fill="none" />

    <!-- Stylized Torso / Shoulders -->
    <path d="M 220 580 C 240 470, 310 430, 400 430 C 490 430, 560 470, 580 580 C 585 640, 585 750, 585 750 L 215 750 C 215 750, 215 640, 220 580 Z" fill="#0f0f14" stroke="rgba(229, 9, 36, 0.5)" stroke-width="1.5" />
    <!-- Chest core element -->
    <polygon points="400,480 430,520 400,560 370,520" fill="#180407" stroke="#e50924" stroke-width="2" />
    <circle cx="400" cy="520" r="8" fill="#e50924" filter="url(#crimsonBloom)" />
  </g>

  <!-- Replaceable Asset Notice Card -->
  <g transform="translate(400, 780)">
    <!-- Container background -->
    <rect x="-260" y="-10" width="520" height="130" rx="18" fill="rgba(14, 14, 18, 0.92)" stroke="rgba(229, 9, 36, 0.6)" stroke-width="1.5" />
    
    <!-- Status badge -->
    <rect x="-140" y="8" width="280" height="24" rx="12" fill="rgba(229, 9, 36, 0.18)" stroke="#e50924" stroke-width="1" />
    <text x="0" y="24" fill="#ff334b" font-family="'General Sans', system-ui, sans-serif" font-size="10.5" font-weight="800" letter-spacing="2.5" text-anchor="middle">
      PORTRAIT ASSET PLACEHOLDER
    </text>

    <!-- Main Name -->
    <text x="0" y="58" fill="#ffffff" font-family="'General Sans', system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="1.5" text-anchor="middle">
      CHIDIMILLA ANUSHA
    </text>

    <!-- Role -->
    <text x="0" y="80" fill="#a1a1aa" font-family="'General Sans', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">
      AI/ML &amp; AIoT ENGINEER
    </text>

    <!-- Replacement instructions -->
    <text x="0" y="104" fill="#ff4d61" font-family="'General Sans', system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">
      READY FOR OFFICIAL PHOTOGRAPH • DRAG &amp; DROP ASSET
    </text>
  </g>
</svg>
